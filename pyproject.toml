[project]
name = "net-mcp"
version = "0.1.0"
description = "MCP server for network engineering — BGP routing, RPKI validation, and DNSSEC-aware DNS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
    "pybgpkit>=0.8",
    "dnspython[dnssec]>=2.6",
    "httpx>=0.27",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
net-mcp = "net_mcp.server:main"

[project.urls]
Repository = "https://github.com/steelcutoatmeal/net-mcp"
Issues = "https://github.com/steelcutoatmeal/net-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/net_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job
